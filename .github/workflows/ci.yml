name: CI

# Triggers on every pull request and on every push to `main`.
# Merge gating: make the `test` job a required status check in
#   Settings → Branches → `main` branch protection (or a ruleset).
# That is a one-time manual repo setting; a workflow file alone cannot
# enforce "required status checks". See design doc for follow-up note.
on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read declared toolchain
        id: toolchain
        shell: bash
        run: |
          echo "node=$(awk '$1 == "nodejs" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "npm=$(awk '$1 == "npm" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "bb=$(awk '$1 == "babashka" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "python=$(awk '$1 == "python" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Set up Babashka
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          bb: ${{ steps.toolchain.outputs.bb }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.toolchain.outputs.node }}
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.toolchain.outputs.python }}

      - name: Align npm and verify toolchain
        run: |
          npm install --global "npm@${{ steps.toolchain.outputs.npm }}"
          ./scripts/check_deps.sh test

      - name: Install Python test dependencies
        run: python -m pip install .

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Web production artifacts
        run: npm run build:web

      - name: Run Web tests
        run: npm run test:web

      - name: Run prepared-build integration tests
        run: bb test:integration

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Run core tests
        run: bb test:core

      - name: Verify STATUS.edn ↔ README sync
        run: bb test:docs

      - name: Container harness (PR #37)
        # ubuntu-latest provides a working Docker daemon. If a future
        # runner lacks Docker, gate this behind a service container or
        # `if: false` with a TODO rather than removing it.
        if: hashFiles('test/container/test.sh') != ''
        run: ./test/container/test.sh

      - name: Tesseraft node lint (.tesseraft/nodes/*)
        # Node packages are directories containing `node.edn`; lint the
        # `node.edn` files directly (passing a directory yields an
        # `Is a directory` parse-error). With nullglob an unmatched glob
        # expands to nothing, so we skip with an explicit TODO instead of
        # failing CI through no fault of the code.
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          targets=(.tesseraft/nodes/*/node.edn)
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo "TODO: no .tesseraft/nodes/* node packages present; skipping node lint"
            exit 0
          fi
          ./bin/tesseraft node lint "${targets[@]}"
